name: gielinomics

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gielinomics
      POSTGRES_USER: gielinomics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - gielinomics-pgdata:/var/lib/postgresql/data
      # Applied on first start only. Re-running against an existing volume is a no-op.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Host 5433: a native Postgres install already owns 5432 on the dev box.
      # Inside the compose network the other services still reach it on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gielinomics -d gielinomics"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingest:
    build:
      context: .
      dockerfile: src/Gielinomics.Ingest/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Gielinomics: "Host=postgres;Database=gielinomics;Username=gielinomics;Password=${POSTGRES_PASSWORD}"
      # Required. The wiki blocks default agents, so the worker refuses to start without it.
      Gielinomics__UserAgent: ${GIELINOMICS_USER_AGENT:?set GIELINOMICS_USER_AGENT in .env}
      Gielinomics__RunBackfill: ${GIELINOMICS_RUN_BACKFILL:-false}
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    ports:
      # Metrics only. /metrics is the Prometheus scrape endpoint, /health is a liveness probe;
      # the worker serves no application routes. Host 9091 keeps 8080 free for the api service.
      - "9091:8080"

  api:
    build:
      context: .
      dockerfile: src/Gielinomics.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Gielinomics: "Host=postgres;Database=gielinomics;Username=gielinomics;Password=${POSTGRES_PASSWORD}"
      # The API calls the hiscores itself on POST /api/players/{name}/track, to infer the
      # account type. Jagex blocks default agents too.
      Gielinomics__UserAgent: ${GIELINOMICS_USER_AGENT:?set GIELINOMICS_USER_AGENT in .env}
      # Bound to all interfaces for development from the Windows box.
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    ports:
      - "8080:8080"

  ai:
    build:
      context: src/Gielinomics.Ai
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      # Set, so the price and hiscore clients read this platform's retained
      # history instead of the upstream APIs. Container name, not localhost:
      # inside the compose network the API answers on api:8080.
      RELDO_GIELINOMICS_URL: "http://api:8080"
      # Only needed to enrol accounts for tracking, which is authenticated.
      # Unset means the AI can read every tracked account but not add one.
      RELDO_GIELINOMICS_TOKEN: ${GIELINOMICS_API_TOKEN:-}
      # The wiki blocks default agents. Shared with the .NET services, because
      # it is the same deployment identifying itself to the same wiki.
      RELDO_USER_AGENT: ${GIELINOMICS_USER_AGENT:?set GIELINOMICS_USER_AGENT in .env}
      # Where the local model server is, for the ask path. Empty is fine: the
      # default command serves search only, which never touches a model.
      RELDO_OLLAMA_API_URL: ${RELDO_OLLAMA_API_URL:-}
      RELDO_DISCORD_TOKEN: ${RELDO_DISCORD_TOKEN:-}
      RELDO_DISCORD_GUILD_ID: ${RELDO_DISCORD_GUILD_ID:-}
    volumes:
      # The embeddings: ~330 MB of build artifact, kept out of the image so a
      # code change does not mean re-pushing them. Populate with `reldo build`,
      # or copy an index you already have into the volume.
      - gielinomics-index:/app/data
    ports:
      # Search and ask, for the frontend. 8100 rather than 8080 to leave the
      # API where it is.
      - "8100:8100"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - gielinomics-grafana:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  gielinomics-pgdata:
  gielinomics-index:
  gielinomics-grafana:
