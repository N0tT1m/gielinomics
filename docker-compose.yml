name: gielinomics

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gielinomics
      POSTGRES_USER: gielinomics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - gielinomics-pgdata:/var/lib/postgresql/data
      # Applied on first start only. Re-running against an existing volume is a no-op.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Host 5433: a native Postgres install already owns 5432 on the dev box.
      # Inside the compose network the other services still reach it on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gielinomics -d gielinomics"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingest:
    build:
      context: .
      dockerfile: src/Gielinomics.Ingest/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Gielinomics: "Host=postgres;Database=gielinomics;Username=gielinomics;Password=${POSTGRES_PASSWORD}"
      # Required. The wiki blocks default agents, so the worker refuses to start without it.
      Gielinomics__UserAgent: ${GIELINOMICS_USER_AGENT:?set GIELINOMICS_USER_AGENT in .env}
      Gielinomics__RunBackfill: ${GIELINOMICS_RUN_BACKFILL:-false}
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    ports:
      # Metrics only. /metrics is the Prometheus scrape endpoint, /health is a liveness probe;
      # the worker serves no application routes. Host 9091 keeps 8080 free for the api service.
      - "9091:8080"

  api:
    build:
      context: .
      dockerfile: src/Gielinomics.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Gielinomics: "Host=postgres;Database=gielinomics;Username=gielinomics;Password=${POSTGRES_PASSWORD}"
      # Bound to all interfaces for development from the Windows box.
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    ports:
      - "8080:8080"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - gielinomics-grafana:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  gielinomics-pgdata:
  gielinomics-grafana:
